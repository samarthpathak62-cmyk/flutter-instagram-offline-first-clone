name: Flutter Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Check Flutter installation
        run: |
          flutter --version
          dart --version

      - name: Generate missing Android platform
        run: |
          if [ ! -f android/settings.gradle ]; then
            flutter create --platforms=android .
          fi

      - name: Check required project files
        run: |
          test -f pubspec.yaml
          test -d lib
          test -d packages
          test -d android
          echo "Project structure check passed"

      - name: Accept Android licenses and install NDK
        run: |
          set +e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"

          yes | flutter doctor --android-licenses >/dev/null 2>&1

          SDKMANAGER="$(find "$SDK/cmdline-tools" "$SDK/tools/bin" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK"
            ls -la "$SDK" || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "ndk;28.0.12433566" \
            "build-tools;36.0.0" \
            "platforms;android-36"

      - name: Install dependencies
        run: |
          flutter pub get
          dart pub get --directory packages/env

      # envied reads packages/env/.env.dev and .env.prod.
      # Those files are gitignored, so CI must write them before build_runner.
      - name: Write Envied .env files
        working-directory: packages/env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
          IOS_CLIENT_ID: ${{ secrets.IOS_CLIENT_ID }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          # Empty GitHub secrets are "" not unset, so :- fallback is not enough.
          supabase_url="${SUPABASE_URL:-}"
          supabase_anon_key="${SUPABASE_ANON_KEY:-}"
          powersync_url="${POWERSYNC_URL:-}"
          web_client_id="${WEB_CLIENT_ID:-}"
          [ -z "$supabase_url" ] && supabase_url="https://example.supabase.co"
          [ -z "$supabase_anon_key" ] && supabase_anon_key="public-anon-key-placeholder"
          [ -z "$powersync_url" ] && powersync_url="https://example.powersync.com"
          [ -z "$web_client_id" ] && web_client_id="web-client-id-placeholder"

          # Not required for Android APK. Legacy FCM key no longer exists on new Firebase projects.
          fcm_server_key="unused-fcm-server-key"
          ios_client_id="unused-ios-client-id"

          write_env_file() {
            cat > "$1" <<EOF
          SUPABASE_URL=${supabase_url}
          SUPABASE_ANON_KEY=${supabase_anon_key}
          POWERSYNC_URL=${powersync_url}
          FCM_SERVER_KEY=${fcm_server_key}
          IOS_CLIENT_ID=${ios_client_id}
          WEB_CLIENT_ID=${web_client_id}
          EOF
          }

          write_env_file .env.dev
          write_env_file .env.prod
          echo "Wrote packages/env/.env.dev and packages/env/.env.prod"

      - name: Generate Dart files
        run: |
          dart run build_runner build --delete-conflicting-outputs || true
          (cd packages/env && dart run build_runner build)

      - name: Analyze Dart code
        run: flutter analyze || true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      # Release flavor signingConfig.release needs a keystore.
      # CI creates a throwaway keystore so assembleProductionRelease can finish.
      - name: Create CI upload keystore
        run: |
          if [ ! -f android/key.properties ]; then
            keytool -genkeypair -v \
              -keystore android/app/ci-upload.jks \
              -storepass android \
              -keypass android \
              -alias ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=IN"
            cat > android/key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=ci
          storeFile=ci-upload.jks
          EOF
          fi

      - name: Build Production APK
        run: |
          flutter build apk \
            --release \
            --flavor production \
            --target lib/main_production.dart

      - name: Build Staging APK
        run: |
          flutter build apk \
            --release \
            --flavor staging \
            --target lib/main_staging.dart

      - name: Build Development APK
        run: |
          flutter build apk \
            --release \
            --flavor development \
            --target lib/main_development.dart

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: production-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-reports
          path: |
            build/reports/
            build/app/outputs/mapping/
          retention-days: 7
          if-no-files-found: ignore
