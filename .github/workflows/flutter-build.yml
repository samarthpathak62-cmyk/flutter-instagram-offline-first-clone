name: Flutter Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Check Flutter installation
        run: |
          flutter --version
          dart --version

      - name: Generate missing Android platform
        run: |
          if [ ! -f android/settings.gradle ]; then
            flutter create --platforms=android .
          fi

      - name: Check required project files
        run: |
          test -f pubspec.yaml
          test -d lib
          test -d packages
          test -d android
          echo "Project structure check passed"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart files
        run: |
          dart run build_runner build \
            --delete-conflicting-outputs || true

      - name: Analyze Dart code
        run: flutter analyze || true
  
      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build Production APK
        run: |
          flutter build apk \
            --release \
            --flavor production \
            --target lib/main_production.dart

      - name: Build Staging APK
        run: |
          flutter build apk \
            --release \
            --flavor staging \
            --target lib/main_staging.dart

      - name: Build Development APK
        run: |
          flutter build apk \
            --release \
            --flavor development \
            --target lib/main_development.dart

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: production-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-reports
          path: |
            build/
            .dart_tool/
          retention-days: 7
